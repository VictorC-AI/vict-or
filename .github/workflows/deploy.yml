name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Versão do Ubuntu fixa: "ubuntu-latest" muda sozinho de versão e pode
# quebrar o build sem nenhuma mudança aqui. Atualizar de propósito.
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # a mesma versão usada no desenvolvimento
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # o site vive em usuario.github.io/nome-do-repo/,
          # então o Vite precisa saber o prefixo.
          # Com domínio próprio, troque por VITE_BASE: /
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
